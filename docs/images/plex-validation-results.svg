    <text class="teal" font-size="16" x="928" y="840">Bundle</text>
    <rect class="chip" height="40" rx="10" width="142" x="1046" y="814" />
    <path class="check" d="M1061 834l5 5 9-10" />
    <text class="teal" font-size="16" x="1085" y="840">Size</text>

    <text class="muted" font-size="18" x="92" y="893">
        Complete player:
        <tspan class="ink" font-weight="600">964,842 bytes</tspan>
