    <text class="muted" font-size="16" x="381" y="684">Real jQuery</text>
    <text class="blue" font-size="16" x="381" y="706">1.11.1 + 4.0</text>

    <rect class="panel" height="155" rx="16" width="273" x="650" y="570" />
