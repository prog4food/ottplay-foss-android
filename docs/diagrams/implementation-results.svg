    <text fill="#51dec4" font-size="18" font-weight="700" x="69" y="198">
        01
    </text>
    <text fill="#edf5ff" font-size="22" font-weight="700" x="111" y="198">
        HLS parse recovery
    </text>
    <text fill="#b8c9df" font-size="15" font-weight="400" x="111" y="221">
        Разбор HLS и бюджет повторов
    </text>
    <text fill="#ffacb5" font-size="12" font-weight="700" x="69" y="246">
        BEFORE / ДО
    </text>
    <text fill="#51dec4" font-size="12" font-weight="700" x="427" y="246">
        AFTER / ПОСЛЕ
    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="69" y="268">
        Parse errors used the
    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="69" y="288">
        generic network path.
    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="427" y="268">
        One same-URL parse retry
    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="427" y="288">
        inside the shared budget.
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="69" y="306">
        Ошибки разбора шли
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="69" y="321">
        по общему сетевому пути.
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="427" y="306">
        Один повтор разбора в общем
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="427" y="321">
        бюджете; новый URL не сбрасывает.
    </text>
