    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="427" y="944">
        Current-item overrides;
    </text>
    <text fill="#edf5ff" font-size="15" font-weight="400" x="427" y="964">
        durable language/role intent.
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="69" y="982">
        Поздние записи стирали выбор;
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="69" y="997">
        равные группы переносили индекс.
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="427" y="982">
        Временный выбор — в своём item;
    </text>
    <text fill="#b8c9df" font-size="12" font-weight="400" x="427" y="997">
        язык и назначение сохраняются.
    </text>
