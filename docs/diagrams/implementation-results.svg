>
    <title id="title">
        Review outcomes and measured bytes / Исправления и измеренный объём
    </title>
    <desc id="desc">
        Five before-and-after behavior comparisons plus zero-based raw and gzip
        byte charts. Increased size is measured feature cost, not a speed
        improvement.
    </desc>
    <rect fill="#0b1220" height="1120" rx="24" width="1400" />
