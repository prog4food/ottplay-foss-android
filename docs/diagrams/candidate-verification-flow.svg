    </text>
    <text class="title" x="40" y="78">
        Candidate verification / Проверка кандидата
    </text>
    <text class="subtitle" x="40" y="111">
        Exact bytes, declared coverage, explicit evidence / Точные байты,
        заданный охват, явные доказательства
    </text>
