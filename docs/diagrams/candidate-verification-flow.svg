    }
    .number {
        font-size: 62px;
        font-weight: 700;
    }
    .formula {
        font-size: 38px;
        font-weight: 700;
    }
    </style>
    <rect fill="#111a2b" height="860" rx="24" width="1200" x="0" y="0" />
    <text class="eyebrow" style="fill:#68d4b4" x="40" y="34">
