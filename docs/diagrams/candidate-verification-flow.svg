<svg
    aria-labelledby="title desc"
    height="860"
    role="img"
    viewBox="0 0 1200 860"
    width="1200"
    xmlns="http://www.w3.org/2000/svg"
>
    <title id="title">Candidate verification flow / Проверка кандидата</title>
    <desc id="desc">
        Build, package with archive hash and source identity, verify and unpack,
        check the declared capabilities, pass the exact scenario set once, save
        a receipt, then require the separate CI and release gate. No dynamic
        fallback, skipped required scenarios or retries masking a failure.
        Сборка, упаковка, проверка, возможности, точный набор сценариев, отчёт,
        допуск CI и релиза. Диаграмма процесса, не заявление об успешном релизе.
    </desc>
    <defs>
        <marker
            id="arrow"
            markerHeight="9"
            markerWidth="9"
            orient="auto"
            refX="7"
            refY="4"
        >
            <path
                d="M0 0 L8 4 L0 8"
                fill="none"
                stroke="#91bfff"
                stroke-width="1.5"
            />
        </marker>
    </defs>
    <style>
    text {
        font-family: Arial, sans-serif;
        fill: #edf3fc;
    }
    .title {
        font-size: 30px;
        font-weight: 700;
    }
    .subtitle {
        font-size: 19px;
        fill: #bfcee4;
    }
    .heading {
        font-size: 23px;
        font-weight: 700;
    }
    .body {
        font-size: 20px;
    }
    .small {
