        x="840"
        y="486"
    >
        7
    </text>
    <text class="heading" style="fill:#91bfff" x="830" y="526">
        CI / release gate
    </text>
    <text class="body" x="830" y="555">Допуск CI и релиза</text>
    <text class="small" x="830" y="607">Require separate hosted evidence</text>
    <text class="small" x="830" y="634">Отдельные доказательства от CI</text>
    <rect
        fill="#3b3024"
        height="104"
        rx="16"
        stroke="#f2c779"
        width="1120"
        x="40"
        y="691"
    />
    <text
        class="heading"
        style="fill:#f2c779"
        text-anchor="middle"
        x="600"
        y="727"
    >
        Any failed check stops acceptance / Любой сбой останавливает приёмку
    </text>
    <text class="body" text-anchor="middle" x="600" y="761">
        No dynamic downgrade, required-test skip or retries masking a failure
    </text>
    <text class="small" text-anchor="middle" x="600" y="785">
        Без урезания профиля, пропуска нужных проверок и маскировки сбоев
