    </text>
    <text class="heading" style="fill:#91bfff" x="60" y="235">Build</text>
    <text class="body" x="60" y="263">Сборка</text>
    <text class="small" x="60" y="312">Production output</text>
    <text class="small" x="60" y="339">Production-артефакты</text>
