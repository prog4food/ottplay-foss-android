    </text>
    <text class="heading" style="fill:#68d4b4" x="445" y="526">
        Save receipt
    </text>
    <text class="body" x="445" y="555">Сохранить отчёт</text>
    <text class="small" x="445" y="607">
        Browser + host + source + outcomes
    </text>
    <text class="small" x="445" y="634">
        Браузер + ОС + исходники + результат
    </text>
    <path
