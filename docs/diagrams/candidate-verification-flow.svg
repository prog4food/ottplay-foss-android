    </text>
    <text class="heading" style="fill:#68d4b4" x="60" y="526">
        Exact scenario set
    </text>
    <text class="body" x="60" y="555">Точный набор сценариев</text>
    <text class="small" x="60" y="607">Each required case passes once</text>
    <text class="small" x="60" y="634">Каждый нужный сценарий — один раз</text>
    <path
