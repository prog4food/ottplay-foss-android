        passed five scenarios each on Chromium, Firefox and WebKit, 15 total.
        Horizontal bars share a scale from zero to five passed scenarios, with
        no skips or retries. These overlapping suites must not be added. Local
        macOS 26.7.1, not GitHub-hosted qualification. Два отдельных набора
        проверок не складываются. Горизонтальные столбцы: общая шкала от нуля до
        пяти пройденных сценариев. Результаты локальные, не результат прогона в
        CI.
