[package]
name = "ottplay-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ottplay-server"
path = "src/main.rs"

[dependencies]
ottplay-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
once_cell = "1"
serde_json = "1"
urlencoding = "2"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
chrono = "0.4"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
tower = "0.5"
md-5 = "0.10"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
async-stream = "0.3"

# Strict typed DER parsing for the supplied TLS certificate key policy.
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
pkcs1 = { version = "0.7.5", default-features = false }
