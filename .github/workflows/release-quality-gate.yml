# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release validation
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
permissions:
  contents: read
jobs:
  scope:
    name: Validation profile (${{ inputs.channel }})
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release channel
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release_validation.py select --channel "$RELEASE_CHANNEL"
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '["vendor/README.md"]'
          REQUIRED_PATHS: '["docs/privacy-policy.md"]'
          FORCE_FULL: 'true'
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
  check-0:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel != 'beta' && (needs.scope.outputs.run == 'true') }}
  check-1:
    uses: ./.github/workflows/native-parity.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel != 'beta' && (needs.scope.outputs.run == 'true') }}
  check-2:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel != 'beta' && (success()) }}
  check-3:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel != 'beta' && (needs.scope.outputs.run == 'true') }}
  check-4:
    uses: ./.github/workflows/container-validation.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel != 'beta' && (needs.scope.outputs.run == 'true') }}
  workflow-contracts:
    name: CI configuration contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt'
      - run: python3 scripts/workflow_contracts.py
      - run: python3 -m unittest discover -s .github/workflow-tests -p 'test_*.py'
    needs:
      - scope
  release-contracts:
    name: Release tooling contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt'
      - run: python3 -m unittest discover -s .github/release-tests -p 'test_*.py' -v
      - name: Check every committed version field
        run: python3 scripts/version_plan.py check-base
    needs:
      - scope
    if: ${{ needs.scope.outputs.run == 'true' }}
  gate:
    name: CI gate
    needs:
      - scope
      - check-0
      - check-1
      - check-2
      - check-3
      - check-4
      - workflow-contracts
      - release-contracts
      - beta-check-0
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact selected validation profile
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release_validation.py gate --channel "$RELEASE_CHANNEL"
  beta-check-0:
    uses: ./.github/workflows/beta-checks.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ inputs.channel == 'beta' && needs.scope.outputs.run == 'true' }}
